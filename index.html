                                        <h3 className="text-xl md:text-2xl font-bold text-slate-800 mb-8 flex items-center gap-3 border-b border-slate-200 pb-5">
                                        <Flag className="text-red-600"/> ผลงาน ทต.หัวดง
                                        </h3>
                                        
                                        <div className="relative pl-8 md:pl-10 border-l-2 border-slate-300 ml-2 space-y-8">
                                        {sport.matches.map((match, mIdx) => (
                                            <div key={mIdx} className="relative">
                                            <div className="absolute -left-[39px] md:-left-[47px] top-1">
                                                <div className={`w-5 h-5 rounded-full border-4 border-white shadow-sm ${
                                                match.status === 'win' ? 'bg-green-500' : 
                                                match.status === 'lose' ? 'bg-red-500' : 'bg-slate-400'
                                                }`}></div>
                                            </div>
                                            
                                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                                                <div className="flex flex-col gap-3 mb-4 border-b border-slate-100 pb-4">
                                                <div className="flex items-center gap-2 text-sm md:text-base font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-lg w-fit">
                                                    <Clock size={16} className="text-blue-500"/> {match.date}
                                                </div>
                                                <span className="text-xs md:text-sm font-semibold text-slate-500 uppercase tracking-wider bg-slate-50 border border-slate-100 px-3 py-1 rounded-md w-fit">
                                                    {match.round}
                                                </span>
                                                </div>
                                                
                                                <div className="flex flex-col gap-2 mt-2">
                                                <div className="text-slate-400 font-medium text-xs md:text-sm">พบกับ</div>
                                                <div className="font-bold text-slate-800 text-base md:text-lg">{match.opponent}</div>
                                                <div className={`mt-3 flex items-center gap-2 font-bold px-4 py-2 rounded-xl text-base w-fit ${
                                                    match.status === 'win' ? 'bg-green-50 text-green-700 border border-green-100' : 
                                                    match.status === 'lose' ? 'bg-red-50 text-red-700 border border-red-100' : 'bg-slate-50 text-slate-700 border border-slate-200'
                                                }`}>
                                                    {match.score}
                                                    <StatusIcon status={match.status} />
                                                </div>
                                                </div>
                                            </div>
                                            </div>
                                        ))}
                                        </div>
                                    </div>

                                    <div className="lg:col-span-8 xl:col-span-9">
                                        <div className="flex flex-col sm:flex-row sm:items-end justify-between mb-6 gap-5">
                                        <div>
                                            <h3 className="text-xl md:text-2xl font-bold text-slate-800 flex items-center gap-3 mb-2">
                                            <Calendar className="text-blue-600" size={28}/> ตารางการแข่งขันทั้งหมด
                                            </h3>
                                            <p className="text-base text-slate-500">อ้างอิงจากโปรแกรมการแข่งขันกีฬา อปท.ลับแลสัมพันธ์ ครั้งที่ 24</p>
                                        </div>
                                        
                                        <div className="flex items-center bg-slate-100 p-1.5 rounded-xl shrink-0 border border-slate-200">
                                            <button 
                                            onClick={() => setScheduleView('graphic')}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-lg text-base font-semibold transition-all ${scheduleView === 'graphic' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                            >
                                            <ImageIcon size={18}/> แบบกราฟิก
                                            </button>
                                            <button 
                                            onClick={() => setScheduleView('table')}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-lg text-base font-semibold transition-all ${scheduleView === 'table' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                            >
                                            <Table size={18}/> แบบตาราง
                                            </button>
                                        </div>
                                        </div>
                                        
                                        {scheduleView === 'graphic' ? (
                                        <VisualSchedule scheduleStrArray={sport.fullSchedule} huaDongMatches={sport.matches} />
                                        ) : (
                                        <div className="animate-in fade-in duration-300">
                                            <div className="flex justify-end mb-3">
                                            <span className="text-sm bg-red-100 text-red-700 px-3 py-1.5 rounded-md font-semibold border border-red-200">ไฮไลท์คู่ ทต.หัวดง</span>
                                            </div>
                                            <ScheduleTable scheduleStrArray={sport.fullSchedule} />
                                        </div>
                                        )}

                                    </div>
                                    </div>

                                </div>
                                );
                            })()}
                            </div>
                        )}
                        </div>
                    )}

                    {activeTab === 'traditional' && (
                        <div className="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-100 animate-in fade-in duration-500">
                        <div className="mb-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-b border-slate-100 pb-6">
                            <div>
                            <h3 className="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-3">
                                <Activity className="text-teal-600" size={32} /> กีฬาพื้นบ้าน
                            </h3>
                            <p className="text-slate-500 mt-3 flex items-center gap-2 text-base md:text-lg">
                                <Clock size={20} className="text-teal-500"/> ทำการแข่งขันในวันที่ 23 มีนาคม 2569
                            </p>
                            </div>
                            <div className="bg-teal-50 text-teal-700 px-6 py-3 rounded-xl text-base md:text-lg font-bold border border-teal-200 shadow-sm shrink-0">
                            เข้าร่วมทั้งหมด 11 รายการ
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            {traditionalSports.map((sport, idx) => (
                            <div key={idx} className="group p-6 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-white hover:shadow-lg hover:border-teal-300 transition-all duration-300 flex items-start gap-5 relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-20 h-20 bg-gradient-to-br from-teal-50 to-transparent rounded-bl-full -z-10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                <div className="bg-white p-3.5 rounded-xl shadow-sm text-teal-600 shrink-0 group-hover:scale-110 group-hover:bg-teal-50 transition-all border border-slate-100 z-10">
                                <Activity size={28} />
                                </div>
                                <div className="z-10 mt-1">
                                <p className="font-bold text-slate-800 text-lg leading-snug group-hover:text-teal-700 transition-colors">{sport}</p>
                                <div className="mt-3 inline-flex items-center gap-2 text-sm font-semibold text-slate-600 bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm">
                                    <CheckCircle2 size={16} className="text-teal-500" /> เข้าร่วมการแข่งขัน
                                </div>
                                </div>
                            </div>
                            ))}
                        </div>
                        </div>
                    )}

                    </div>
                </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
